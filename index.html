<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Slitscan Studio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: manipulation;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      flex-shrink: 0;
    }
    .header-title { font-size: 13px; font-weight: bold; letter-spacing: 0.05em; color: #38bdf8; }
    .btn {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-primary { background: #38bdf8; color: #09090b; font-weight: bold; border: none; }
    .btn-danger { background: #ef4444; color: #fff; border: none; }
    
    #canvas-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #slit-canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    /* 初期オーバーレイ & ログ */
    #start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      gap: 12px;
      text-align: center;
    }
    #log-box {
      width: 100%;
      max-width: 320px;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      color: #a1a1aa;
      text-align: left;
      height: 70px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* 下部コントロール */
    #controls {
      background: #18181b;
      border-top: 1px solid #27272a;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .row { display: flex; align-items: center; gap: 8px; }
    .preview-box {
      width: 64px;
      height: 48px;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid #3f3f46;
      flex-shrink: 0;
    }
    #webcam { width: 100%; height: 100%; object-fit: cover; }
    #guide-line { position: absolute; background: #38bdf8; pointer-events: none; }
    
    select, input[type=range] {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      padding: 6px;
      font-size: 12px;
    }
    input[type=range] { flex: 1; accent-color: #38bdf8; }
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid #52525b;
      display: inline-block;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">SLITSCAN</div>
    <div class="row">
      <button id="rec-btn" class="btn">録画</button>
      <button id="save-btn" class="btn btn-primary">保存(PNG)</button>
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="slit-canvas"></canvas>

    <!-- 起動画面 & ログ表示 -->
    <div id="start-overlay">
      <h2 style="font-size: 15px;">カメラの起動</h2>
      <p style="font-size: 12px; color: #a1a1aa;">タップしてカメラアクセスを許可してください</p>
      <button id="big-start-btn" class="btn btn-primary" style="padding: 12px 24px; font-size: 14px;">
        カメラを起動する
      </button>
      <div id="log-box">待機中...</div>
    </div>
  </div>

  <div id="controls">
    <!-- プレビューと位置調整 -->
    <div class="row">
      <div class="preview-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="guide-line"></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #a1a1aa;">
          <span>スリット位置</span>
          <span id="pos-val" style="color: #38bdf8;">50%</span>
        </div>
        <input type="range" id="slit-pos" min="0" max="100" value="50">
      </div>
    </div>

    <!-- カメラ選択・向き・設定 -->
    <div class="row">
      <select id="cam-select" style="flex: 2;">
        <option value="">カメラを選択...</option>
      </select>
      <button id="switch-cam-btn" class="btn">前後切替</button>
      <select id="direction-select" style="flex: 1;">
        <option value="vertical">垂直</option>
        <option value="horizontal">水平</option>
      </select>
    </div>

    <!-- アクションボタン -->
    <div class="row">
      <button id="pause-btn" class="btn" style="flex: 1;">一時停止</button>
      <button id="clear-btn" class="btn" style="flex: 1;">クリア</button>
      <div class="row" style="background: #27272a; padding: 4px 8px; border-radius: 4px; border: 1px solid #3f3f46;">
        <div class="color-dot" id="color-dot"></div>
        <span id="color-hex" style="font-size: 10px; font-family: monospace;">#000000</span>
      </div>
    </div>
  </div>

  <script>
    // 診断ログ関数
    const logBox = document.getElementById('log-box');
    function log(msg) {
      console.log(msg);
      logBox.textContent = `[${new Date().toTimeString().slice(0, 8)}] ${msg}\n` + logBox.textContent;
    }

    window.onerror = function(msg, url, line) {
      log(`JSエラー: ${msg} (${line}行目)`);
      return false;
    };

    // 要素取得
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('slit-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const guideLine = document.getElementById('guide-line');
    const slitPos = document.getElementById('slit-pos');
    const posVal = document.getElementById('pos-val');
    const camSelect = document.getElementById('cam-select');
    const switchCamBtn = document.getElementById('switch-cam-btn');
    const dirSelect = document.getElementById('direction-select');
    const pauseBtn = document.getElementById('pause-btn');
    const clearBtn = document.getElementById('clear-btn');
    const saveBtn = document.getElementById('save-btn');
    const recBtn = document.getElementById('rec-btn');
    const bigStartBtn = document.getElementById('big-start-btn');
    const startOverlay = document.getElementById('start-overlay');
    const colorDot = document.getElementById('color-dot');
    const colorHex = document.getElementById('color-hex');

    // 内部変数
    let stream = null;
    let isPaused = false;
    let currentFacingMode = 'environment';
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // キャンバス初期化
    function initCanvas(w = 1280, h = 720) {
      canvas.width = w;
      canvas.height = h;
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, w, h);
    }
    initCanvas();

    // デバイス一覧取得
    async function updateDeviceList() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        camSelect.innerHTML = '';
        videoDevices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          opt.textContent = dev.label || `カメラ ${idx + 1}`;
          camSelect.appendChild(opt);
        });
        log(`カメラ検出: ${videoDevices.length}台`);
      } catch (e) {
        log(`一覧取得失敗: ${e.message}`);
      }
    }

    // カメラ起動メイン関数
    async function initCamera(deviceId = null) {
      log("起動処理を開始...");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log("エラー: navigator.mediaDevices が未対応です (非HTTPSの可能性)");
        alert("ブラウザがカメラ機能に対応していないか、HTTPS接続ではありません。");
        return;
      }

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }

      // 制約条件
      const constraints = {
        audio: false,
        video: deviceId 
          ? { deviceId: { exact: deviceId } } 
          : { facingMode: { ideal: currentFacingMode } }
      };

      try {
        log("カメラ権限を要求中...");
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        log("カメラ取得成功！映像を反映中...");
      } catch (err) {
        log(`条件指定失敗: ${err.name}。簡易設定で再試行`);
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          log("簡易設定で接続成功！");
        } catch (finalErr) {
          log(`完全失敗: ${finalErr.name} - ${finalErr.message}`);
          alert(`カメラ起動に失敗しました:\n[${finalErr.name}] ${finalErr.message}`);
          return;
        }
      }

      video.srcObject = stream;
      try {
        await video.play();
        log("ビデオ再生開始");
      } catch (playErr) {
        log(`playエラー: ${playErr.message}`);
      }

      startOverlay.style.display = 'none';
      updateGuide();
      await updateDeviceList();
    }

    // ガイド線更新
    function updateGuide() {
      const p = slitPos.value;
      posVal.textContent = `${p}%`;
      const isVert = dirSelect.value === 'vertical';
      if (isVert) {
        guideLine.style.top = '0';
        guideLine.style.height = '100%';
        guideLine.style.left = `${p}%`;
        guideLine.style.width = '2px';
      } else {
        guideLine.style.left = '0';
        guideLine.style.width = '100%';
        guideLine.style.top = `${p}%`;
        guideLine.style.height = '2px';
      }
    }

    // スリット描画
    function drawSlit() {
      if (!isPaused && video.readyState >= 2) {
        const sw = video.videoWidth;
        const sh = video.videoHeight;
        const isVert = dirSelect.value === 'vertical';
        const ratio = parseInt(slitPos.value) / 100;

        if (sw && sh) {
          if (isVert) {
            const sx = Math.floor(sw * ratio);
            // 1pxシフトして描画
            ctx.drawImage(canvas, 1, 0, canvas.width - 1, canvas.height, 0, 0, canvas.width - 1, canvas.height);
            ctx.drawImage(video, sx, 0, 1, sh, canvas.width - 1, 0, 1, canvas.height);
          } else {
            const sy = Math.floor(sh * ratio);
            ctx.drawImage(canvas, 0, 1, canvas.width, canvas.height - 1, 0, 0, canvas.width, canvas.height - 1);
            ctx.drawImage(video, 0, sy, sw, 1, 0, canvas.height - 1, canvas.width, 1);
          }
          inspectColor(video, isVert, ratio, sw, sh);
        }
      }
      requestAnimationFrame(drawSlit);
    }

    // 色抽出
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = 1; tmpCanvas.height = 1;
    const tmpCtx = tmpCanvas.getContext('2d');

    function inspectColor(src, isVert, ratio, sw, sh) {
      const sx = isVert ? Math.floor(sw * ratio) : Math.floor(sw / 2);
      const sy = isVert ? Math.floor(sh / 2) : Math.floor(sh * ratio);
      tmpCtx.drawImage(src, sx, sy, 1, 1, 0, 0, 1, 1);
      const [r, g, b] = tmpCtx.getImageData(0, 0, 1, 1).data;
      const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
      colorDot.style.backgroundColor = hex;
      colorHex.textContent = hex.toUpperCase();
    }

    // イベントリスナー
    bigStartBtn.onclick = () => initCamera();
    slitPos.oninput = updateGuide;
    dirSelect.onchange = updateGuide;

    switchCamBtn.onclick = () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    };

    camSelect.onchange = (e) => {
      if (e.target.value) initCamera(e.target.value);
    };

    pauseBtn.onclick = () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '再開' : '一時停止';
      pauseBtn.style.color = isPaused ? '#38bdf8' : '#fff';
    };

    clearBtn.onclick = () => {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };

    saveBtn.onclick = () => {
      const a = document.createElement('a');
      a.download = `slitscan-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    };

    recBtn.onclick = () => {
      if (!isRecording) {
        recordedChunks = [];
        const s = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(s, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const a = document.createElement('a');
          a.download = `slitscan-${Date.now()}.webm`;
          a.href = URL.createObjectURL(blob);
          a.click();
        };
        mediaRecorder.start();
        isRecording = true;
        recBtn.textContent = '停止';
        recBtn.className = 'btn btn-danger';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.textContent = '録画';
        recBtn.className = 'btn';
      }
    };

    // 描画ループ開始
    requestAnimationFrame(drawSlit);
  </script>
</body>
</html>
