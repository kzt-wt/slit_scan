<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Slitscan Studio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: manipulation;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      flex-shrink: 0;
      z-index: 30;
      gap: 6px;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-title { font-size: 13px; font-weight: bold; letter-spacing: 0.05em; color: #38bdf8; }
    
    .tab-group {
      display: flex;
      background: #27272a;
      border-radius: 5px;
      padding: 2px;
      gap: 2px;
    }
    .tab-btn {
      background: transparent;
      color: #a1a1aa;
      border: none;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #3f3f46;
      color: #fff;
      font-weight: bold;
    }

    .btn {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .btn:active { background: #3f3f46; }
    .btn-primary { background: #38bdf8; color: #09090b; font-weight: bold; border: none; }
    .btn-danger { background: #ef4444; color: #fff; border: none; }

    #workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #slit-canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
      gap: 10px;
      text-align: center;
    }
    #log-box {
      width: 100%;
      max-width: 320px;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 10px;
      color: #a1a1aa;
      text-align: left;
      height: 60px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    #controls {
      background: #18181b;
      border-top: 1px solid #27272a;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      z-index: 20;
    }
    #controls.panel-hidden { display: none !important; }

    .row { display: flex; align-items: center; gap: 6px; }
    
    .preview-box {
      width: 58px;
      height: 44px;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid #3f3f46;
      flex-shrink: 0;
    }
    #webcam, #file-video, #preview-img { width: 100%; height: 100%; object-fit: cover; }
    #guide-line { position: absolute; background: #38bdf8; pointer-events: none; }

    select, input[type=range], input[type=file] {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
    }
    input[type=range] { flex: 1; accent-color: #38bdf8; }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid #52525b;
      display: inline-block;
      flex-shrink: 0;
    }
    
    /* 向きに応じて伸縮するカラーバー */
    #spectrum-canvas {
      border-radius: 3px;
      border: 1px solid #3f3f46;
      background: #09090b;
    }

    .mode-section { display: flex; flex-direction: column; gap: 6px; }
    .hidden { display: none !important; }

    @media (min-width: 768px), (orientation: landscape) {
      #workspace { flex-direction: row; }
      #controls {
        width: 285px;
        border-top: none;
        border-left: 1px solid #27272a;
        height: 100%;
        overflow-y: auto;
        padding: 12px;
        gap: 8px;
        justify-content: flex-start;
      }
      .preview-box { width: 84px; height: 60px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="header-title">SLITSCAN</div>
      <div class="tab-group">
        <button id="tab-live" class="tab-btn active">カメラ</button>
        <button id="tab-video" class="tab-btn">動画</button>
        <button id="tab-image" class="tab-btn">静止画</button>
      </div>
    </div>
    <div class="row">
      <button id="toggle-panel-btn" class="btn">パネル消す</button>
      <button id="rec-btn" class="btn">録画</button>
      <button id="save-btn" class="btn btn-primary">保存</button>
    </div>
  </header>

  <div id="workspace">
    <!-- キャンバス領域 -->
    <div id="canvas-container">
      <canvas id="slit-canvas"></canvas>

      <!-- カメラ起動オーバーレイ -->
      <div id="start-overlay">
        <h2 style="font-size: 14px;">カメラの起動</h2>
        <p style="font-size: 11px; color: #a1a1aa;">タップしてカメラアクセスを開始</p>
        <button id="big-start-btn" class="btn btn-primary" style="padding: 10px 20px; font-size: 13px;">
          カメラを起動する
        </button>
        <div id="log-box">待機中...</div>
      </div>
    </div>

    <!-- 操作パネル -->
    <div id="controls">
      <!-- プレビュー窓 ＆ スリット位置スライダー -->
      <div class="row">
        <div class="preview-box">
          <video id="webcam" autoplay playsinline muted></video>
          <video id="file-video" playsinline muted loop class="hidden"></video>
          <img id="preview-img" class="hidden" alt="プレビュー">
          <div id="guide-line"></div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; justify-content: space-between; font-size: 10px; color: #a1a1aa;">
            <span>サンプリング位置</span>
            <span id="pos-val" style="color: #38bdf8;">50%</span>
          </div>
          <input type="range" id="slit-pos" min="0" max="100" value="50">
        </div>
      </div>

      <!-- モード別コントロール -->
      <!-- 1. カメラモード -->
      <div id="section-live" class="mode-section">
        <div class="row">
          <select id="cam-select" style="flex: 1; min-width: 0;">
            <option value="">カメラ選択...</option>
          </select>
          <button id="switch-cam-btn" class="btn">前後</button>
        </div>
      </div>

      <!-- 2. 動画ファイルモード -->
      <div id="section-video" class="mode-section hidden">
        <input type="file" id="video-file-input" accept="video/*" style="width: 100%;">
        <div class="row">
          <button id="video-play-btn" class="btn" style="flex: 1;">再生 / 停止</button>
          <select id="video-speed" style="width: 75px;">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1.0x</option>
            <option value="2">2.0x</option>
          </select>
        </div>
      </div>

      <!-- 3. 静止画ファイルモード -->
      <div id="section-image" class="mode-section hidden">
        <input type="file" id="image-file-input" accept="image/*" style="width: 100%;">
        <div class="row">
          <button id="image-scan-btn" class="btn btn-primary" style="flex: 1;">端から走査</button>
          <button id="image-barcode-btn" class="btn" style="flex: 1;">全編バーコード</button>
        </div>
      </div>

      <!-- 合成スタイル切替（通常ストリーム蓄積 vs 片側通常＋片側バーコード） -->
      <div class="row" id="render-style-row">
        <span style="font-size: 10px; color: #a1a1aa; white-space: nowrap;">描画モード:</span>
        <select id="render-mode-select" style="flex: 1;">
          <option value="accumulate">連続時間蓄積 (標準)</option>
          <option value="half_barcode">片側バーコード合成</option>
        </select>
      </div>

      <!-- バーコード合成時の方向指定 -->
      <div class="row hidden" id="barcode-side-row">
        <span style="font-size: 10px; color: #a1a1aa; white-space: nowrap;">バーコード側:</span>
        <select id="barcode-side-select" style="flex: 1;">
          <option value="right">スリットより右側</option>
          <option value="left">スリットより左側</option>
          <option value="bottom">スリットより下側</option>
          <option value="top">スリットより上側</option>
        </select>
      </div>

      <!-- 共通スリット設定 -->
      <div class="row">
        <select id="direction-select" style="flex: 1.2;">
          <option value="vertical">垂直スリット</option>
          <option value="horizontal">水平スリット</option>
        </select>
        <select id="slit-width" style="flex: 0.9;" title="スリット幅">
          <option value="1">幅: 1px</option>
          <option value="2">幅: 2px</option>
          <option value="4">幅: 4px</option>
          <option value="8">幅: 8px</option>
          <option value="16">幅: 16px</option>
        </select>
        <select id="slit-count" style="flex: 0.9;" title="1コマ当たりのスリット数">
          <option value="1">スリット: 1</option>
          <option value="2">スリット: 2</option>
          <option value="4">スリット: 4</option>
          <option value="8">スリット: 8</option>
          <option value="16">スリット: 16</option>
        </select>
      </div>

      <!-- 一時停止 & クリア -->
      <div class="row">
        <button id="pause-btn" class="btn" style="flex: 1;">一時停止</button>
        <button id="clear-btn" class="btn" style="flex: 1;">クリア</button>
      </div>

      <!-- カラーバー ＆ 色抽出 -->
      <div style="background: #27272a; padding: 6px 8px; border-radius: 4px; border: 1px solid #3f3f46; display: flex; flex-direction: column; gap: 5px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 10px; color: #a1a1aa;" id="spectrum-label">スリット断面カラーバー (縦)</span>
          <div class="row" style="gap: 4px;">
            <div class="color-dot" id="color-dot"></div>
            <span id="color-hex" style="font-size: 10px; font-family: monospace;">#000000</span>
          </div>
        </div>
        <!-- 向きに応じたカラーバー表示コンテナ -->
        <div id="spectrum-container" style="display: flex; justify-content: center; align-items: center; width: 100%; min-height: 20px;">
          <canvas id="spectrum-canvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const logBox = document.getElementById('log-box');
    function log(msg) {
      console.log(msg);
      logBox.textContent = `[${new Date().toTimeString().slice(0, 8)}] ${msg}\n` + logBox.textContent;
    }

    // DOM要素
    const webcam = document.getElementById('webcam');
    const fileVideo = document.getElementById('file-video');
    const previewImg = document.getElementById('preview-img');
    const canvas = document.getElementById('slit-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const guideLine = document.getElementById('guide-line');
    const slitPos = document.getElementById('slit-pos');
    const posVal = document.getElementById('pos-val');
    const camSelect = document.getElementById('cam-select');
    const switchCamBtn = document.getElementById('switch-cam-btn');
    const dirSelect = document.getElementById('direction-select');
    const slitWidth = document.getElementById('slit-width');
    const slitCountSelect = document.getElementById('slit-count');
    const renderModeSelect = document.getElementById('render-mode-select');
    const barcodeSideRow = document.getElementById('barcode-side-row');
    const barcodeSideSelect = document.getElementById('barcode-side-select');
    const pauseBtn = document.getElementById('pause-btn');
    const clearBtn = document.getElementById('clear-btn');
    const saveBtn = document.getElementById('save-btn');
    const recBtn = document.getElementById('rec-btn');
    const bigStartBtn = document.getElementById('big-start-btn');
    const startOverlay = document.getElementById('start-overlay');
    const colorDot = document.getElementById('color-dot');
    const colorHex = document.getElementById('color-hex');
    const spectrumCanvas = document.getElementById('spectrum-canvas');
    const specCtx = spectrumCanvas.getContext('2d');
    const spectrumLabel = document.getElementById('spectrum-label');
    const controls = document.getElementById('controls');
    const togglePanelBtn = document.getElementById('toggle-panel-btn');

    // モードタブ
    const tabLive = document.getElementById('tab-live');
    const tabVideo = document.getElementById('tab-video');
    const tabImage = document.getElementById('tab-image');
    const sectionLive = document.getElementById('section-live');
    const sectionVideo = document.getElementById('section-video');
    const sectionImage = document.getElementById('section-image');

    // ファイル入力
    const videoFileInput = document.getElementById('video-file-input');
    const videoPlayBtn = document.getElementById('video-play-btn');
    const videoSpeed = document.getElementById('video-speed');
    const imageFileInput = document.getElementById('image-file-input');
    const imageScanBtn = document.getElementById('image-scan-btn');
    const imageBarcodeBtn = document.getElementById('image-barcode-btn');

    let currentMode = 'live';
    let stream = null;
    let isPaused = false;
    let currentFacingMode = 'environment';
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let loadedImage = null;
    let imageAnimId = null;

    // パネル開閉
    let panelVisible = true;
    togglePanelBtn.onclick = () => {
      panelVisible = !panelVisible;
      controls.classList.toggle('panel-hidden', !panelVisible);
      togglePanelBtn.textContent = panelVisible ? 'パネル消す' : 'パネル表示';
      togglePanelBtn.style.color = panelVisible ? '#fff' : '#38bdf8';
    };

    function initCanvas(w = 1280, h = 720) {
      canvas.width = w;
      canvas.height = h;
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, w, h);
    }
    initCanvas();

    // 描画モード切替時のUI制御
    renderModeSelect.onchange = () => {
      if (renderModeSelect.value === 'half_barcode') {
        barcodeSideRow.classList.remove('hidden');
      } else {
        barcodeSideRow.classList.add('hidden');
      }
      if (currentMode === 'image' && loadedImage) {
        drawImageMode();
      }
    };

    barcodeSideSelect.onchange = () => {
      if (currentMode === 'image' && loadedImage) {
        drawImageMode();
      }
    };

    // モード切り替え
    function setMode(mode) {
      currentMode = mode;
      [tabLive, tabVideo, tabImage].forEach(t => t.classList.remove('active'));
      [sectionLive, sectionVideo, sectionImage].forEach(s => s.classList.add('hidden'));
      webcam.classList.add('hidden');
      fileVideo.classList.add('hidden');
      previewImg.classList.add('hidden');

      if (mode === 'live') {
        tabLive.classList.add('active');
        sectionLive.classList.remove('hidden');
        webcam.classList.remove('hidden');
        if (!stream) startOverlay.style.display = 'flex';
      } else if (mode === 'video') {
        tabVideo.classList.add('active');
        sectionVideo.classList.remove('hidden');
        fileVideo.classList.remove('hidden');
        startOverlay.style.display = 'none';
      } else if (mode === 'image') {
        tabImage.classList.add('active');
        sectionImage.classList.remove('hidden');
        previewImg.classList.remove('hidden');
        startOverlay.style.display = 'none';
        if (loadedImage) drawImageMode();
      }
      updateGuide();
    }
    tabLive.onclick = () => setMode('live');
    tabVideo.onclick = () => setMode('video');
    tabImage.onclick = () => setMode('image');

    // カメラ関連
    async function updateDeviceList() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        camSelect.innerHTML = '';
        videoDevices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          opt.textContent = dev.label || `カメラ ${idx + 1}`;
          camSelect.appendChild(opt);
        });
        log(`カメラ検出: ${videoDevices.length}台`);
      } catch (e) {
        log(`一覧取得失敗: ${e.message}`);
      }
    }

    async function initCamera(deviceId = null) {
      log("カメラ初期化開始...");
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("HTTPS接続でアクセスしてください。");
        return;
      }
      if (stream) stream.getTracks().forEach(t => t.stop());

      const constraints = {
        audio: false,
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: currentFacingMode } }
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        log("カメラ接続完了");
      } catch (err) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          log("標準カメラで接続完了");
        } catch (finalErr) {
          alert(`カメラ起動に失敗しました: [${finalErr.name}]`);
          return;
        }
      }

      webcam.srcObject = stream;
      try { await webcam.play(); } catch (e) {}
      startOverlay.style.display = 'none';
      updateGuide();
      await updateDeviceList();
    }

    bigStartBtn.onclick = () => initCamera();
    switchCamBtn.onclick = () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    };
    camSelect.onchange = (e) => { if (e.target.value) initCamera(e.target.value); };

    // 動画ファイル処理
    videoFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        fileVideo.src = url;
        fileVideo.onloadedmetadata = () => {
          initCanvas(fileVideo.videoWidth, fileVideo.videoHeight);
          fileVideo.play();
          videoPlayBtn.textContent = '停止';
          updateGuide();
        };
      }
    };
    videoPlayBtn.onclick = () => {
      if (fileVideo.paused) {
        fileVideo.play();
        videoPlayBtn.textContent = '停止';
      } else {
        fileVideo.pause();
        videoPlayBtn.textContent = '再生';
      }
    };
    videoSpeed.onchange = (e) => {
      fileVideo.playbackRate = parseFloat(e.target.value);
    };

    // 静止画ファイル処理
    imageFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            loadedImage = img;
            previewImg.src = evt.target.result;
            initCanvas(img.width, img.height);
            updateGuide();
            drawImageMode();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    function drawImageMode() {
      if (!loadedImage) return;
      if (renderModeSelect.value === 'half_barcode') {
        drawHalfBarcode(loadedImage);
      } else {
        // 標準モードなら画像全体をそのまま表示
        ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);
        inspectColorAndSpectrum(loadedImage, dirSelect.value === 'vertical', parseInt(slitPos.value) / 100);
      }
    }

    imageScanBtn.onclick = () => {
      if (!loadedImage) return alert('画像を先に選択してください');
      let pos = 0;
      if (imageAnimId) cancelAnimationFrame(imageAnimId);
      function step() {
        if (pos <= 100) {
          slitPos.value = pos;
          updateGuide();
          if (renderModeSelect.value === 'half_barcode') {
            drawHalfBarcode(loadedImage, pos / 100);
          } else {
            drawSlitAccumulate(loadedImage, pos / 100);
          }
          pos += 0.5;
          imageAnimId = requestAnimationFrame(step);
        }
      }
      step();
    };

    imageBarcodeBtn.onclick = () => {
      if (!loadedImage) return alert('画像を先に選択してください');
      const isVert = dirSelect.value === 'vertical';
      const steps = isVert ? canvas.width : canvas.height;
      const sw = loadedImage.width;
      const sh = loadedImage.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < steps; i++) {
        const ratio = i / steps;
        if (isVert) {
          ctx.drawImage(loadedImage, Math.floor(sw * ratio), 0, 1, sh, i, 0, 1, canvas.height);
        } else {
          ctx.drawImage(loadedImage, 0, Math.floor(sh * ratio), sw, 1, 0, i, canvas.width, 1);
        }
      }
      inspectColorAndSpectrum(loadedImage, isVert, parseInt(slitPos.value) / 100);
    };

    // ガイド線更新
    function updateGuide() {
      const p = slitPos.value;
      posVal.textContent = `${p}%`;
      const isVert = dirSelect.value === 'vertical';
      if (isVert) {
        guideLine.style.top = '0';
        guideLine.style.height = '100%';
        guideLine.style.left = `${p}%`;
        guideLine.style.width = '2px';
      } else {
        guideLine.style.left = '0';
        guideLine.style.width = '100%';
        guideLine.style.top = `${p}%`;
        guideLine.style.height = '2px';
      }
      if (currentMode === 'image' && loadedImage) {
        drawImageMode();
      }
    }
    slitPos.oninput = updateGuide;
    dirSelect.onchange = () => {
      // 垂直なら縦長バーコード、水平なら横長バーコードに切り替え
      updateGuide();
      if (currentMode === 'image' && loadedImage) drawImageMode();
    };

    // --- 描画処理 1: 連続時間蓄積 (スリットスキャン標準) ---
    function drawSlitAccumulate(source, customRatio = null) {
      const sw = source.videoWidth || source.naturalWidth || source.width;
      const sh = source.videoHeight || source.naturalHeight || source.height;
      if (!sw || !sh) return;

      const isVert = dirSelect.value === 'vertical';
      const width = parseInt(slitWidth.value) || 1;
      const count = parseInt(slitCountSelect.value) || 1;
      const baseRatio = customRatio !== null ? customRatio : parseInt(slitPos.value) / 100;

      for (let i = 0; i < count; i++) {
        const offsetRatio = count > 1 ? ((i / (count - 1)) - 0.5) * 0.1 : 0;
        const ratio = Math.min(Math.max(baseRatio + offsetRatio, 0), 1);

        if (isVert) {
          const sx = Math.floor((sw - width) * ratio);
          ctx.drawImage(canvas, width, 0, canvas.width - width, canvas.height, 0, 0, canvas.width - width, canvas.height);
          ctx.drawImage(source, sx, 0, width, sh, canvas.width - width, 0, width, canvas.height);
        } else {
          const sy = Math.floor((sh - width) * ratio);
          ctx.drawImage(canvas, 0, width, canvas.width, canvas.height - width, 0, 0, canvas.width, canvas.height - width);
          ctx.drawImage(source, 0, sy, sw, width, 0, canvas.height - width, canvas.width, width);
        }
      }
      inspectColorAndSpectrum(source, isVert, baseRatio);
    }

    // --- 描画処理 2: 片側通常 ＋ 片側バーコード合成 ---
    function drawHalfBarcode(source, customRatio = null) {
      const sw = source.videoWidth || source.naturalWidth || source.width;
      const sh = source.videoHeight || source.naturalHeight || source.height;
      if (!sw || !sh) return;

      const cw = canvas.width;
      const ch = canvas.height;
      const baseRatio = customRatio !== null ? customRatio : parseInt(slitPos.value) / 100;
      const side = barcodeSideSelect.value;
      const isVert = dirSelect.value === 'vertical';

      // 1. まず元画像を全面に描画
      ctx.drawImage(source, 0, 0, sw, sh, 0, 0, cw, ch);

      // 2. 指定方向の片側のみ、スリットラインの色を引き伸ばしてバーコード状に上書き
      if (side === 'right') {
        const splitX = Math.floor(cw * baseRatio);
        const sx = Math.floor(sw * baseRatio);
        const targetW = cw - splitX;
        if (targetW > 0) {
          ctx.drawImage(source, sx, 0, 1, sh, splitX, 0, targetW, ch);
        }
      } else if (side === 'left') {
        const splitX = Math.floor(cw * baseRatio);
        const sx = Math.floor(sw * baseRatio);
        if (splitX > 0) {
          ctx.drawImage(source, sx, 0, 1, sh, 0, 0, splitX, ch);
        }
      } else if (side === 'bottom') {
        const splitY = Math.floor(ch * baseRatio);
        const sy = Math.floor(sh * baseRatio);
        const targetH = ch - splitY;
        if (targetH > 0) {
          ctx.drawImage(source, 0, sy, sw, 1, 0, splitY, cw, targetH);
        }
      } else if (side === 'top') {
        const splitY = Math.floor(ch * baseRatio);
        const sy = Math.floor(sh * baseRatio);
        if (splitY > 0) {
          ctx.drawImage(source, 0, sy, sw, 1, 0, 0, cw, splitY);
        }
      }

      inspectColorAndSpectrum(source, isVert, baseRatio);
    }

    // メイン描画ループ
    function renderLoop() {
      if (!isPaused) {
        const activeSource = (currentMode === 'live') ? webcam : (currentMode === 'video' ? fileVideo : null);
        if (activeSource && activeSource.readyState >= 2 && !activeSource.paused) {
          if (renderModeSelect.value === 'half_barcode') {
            drawHalfBarcode(activeSource);
          } else {
            drawSlitAccumulate(activeSource);
          }
        }
      }
      requestAnimationFrame(renderLoop);
    }

    // カラーバー（向きの整合性を完全修正）& 色抽出
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = 1; tmpCanvas.height = 1;
    const tmpCtx = tmpCanvas.getContext('2d');

    function inspectColorAndSpectrum(src, isVert, ratio) {
      const sw = src.videoWidth || src.naturalWidth || src.width;
      const sh = src.videoHeight || src.naturalHeight || src.height;
      if (!sw || !sh) return;

      // 垂直スリットの場合: 縦方向（Y軸）の色分布なので、カラーバーも縦向きに合わせる
      if (isVert) {
        spectrumLabel.textContent = "スリット断面 (上→下)";
        if (spectrumCanvas.width !== 16 || spectrumCanvas.height !== 64) {
          spectrumCanvas.width = 16;
          spectrumCanvas.height = 64;
          spectrumCanvas.style.width = '16px';
          spectrumCanvas.style.height = '64px';
        }
        const sx = Math.floor(sw * ratio);
        specCtx.drawImage(src, sx, 0, 1, sh, 0, 0, spectrumCanvas.width, spectrumCanvas.height);
      } 
      // 水平スリットの場合: 横方向（X軸）の色分布なので、カラーバーも横向きに合わせる
      else {
        spectrumLabel.textContent = "スリット断面 (左→右)";
        if (spectrumCanvas.width !== 128 || spectrumCanvas.height !== 8) {
          spectrumCanvas.width = 128;
          spectrumCanvas.height = 8;
          spectrumCanvas.style.width = '100%';
          spectrumCanvas.style.height = '8px';
        }
        const sy = Math.floor(sh * ratio);
        specCtx.drawImage(src, 0, sy, sw, 1, 0, 0, spectrumCanvas.width, spectrumCanvas.height);
      }

      // 中央ピクセル色抽出
      const sx = isVert ? Math.floor(sw * ratio) : Math.floor(sw / 2);
      const sy = isVert ? Math.floor(sh / 2) : Math.floor(sh * ratio);
      tmpCtx.drawImage(src, sx, sy, 1, 1, 0, 0, 1, 1);
      const [r, g, b] = tmpCtx.getImageData(0, 0, 1, 1).data;
      const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
      colorDot.style.backgroundColor = hex;
      colorHex.textContent = hex.toUpperCase();
    }

    // 共通コントロール
    pauseBtn.onclick = () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '再開' : '一時停止';
      pauseBtn.style.color = isPaused ? '#38bdf8' : '#fff';
    };
    clearBtn.onclick = () => {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
    saveBtn.onclick = () => {
      const a = document.createElement('a');
      a.download = `slitscan-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    };
    recBtn.onclick = () => {
      if (!isRecording) {
        recordedChunks = [];
        const s = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(s, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const a = document.createElement('a');
          a.download = `slitscan-${Date.now()}.webm`;
          a.href = URL.createObjectURL(blob);
          a.click();
        };
        mediaRecorder.start();
        isRecording = true;
        recBtn.textContent = '停止';
        recBtn.className = 'btn btn-danger';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.textContent = '録画';
        recBtn.className = 'btn';
      }
    };

    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
