<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Slitscan Studio</title>

  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slitscan">

  <!-- Tailwind & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>

  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    .checkerboard {
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-image: 
        linear-gradient(45deg, #18181b 25%, transparent 25%),
        linear-gradient(-45deg, #18181b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #18181b 75%),
        linear-gradient(-45deg, transparent 75%, #18181b 75%);
    }
    /* スライダー操作感向上 */
    input[type=range] {
      height: 6px;
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] w-screen overflow-hidden font-sans select-none">

  <!-- ヘッダー（スマホに配慮してスリム化） -->
  <header class="flex items-center justify-between px-3 py-2 bg-zinc-900 border-b border-zinc-800 shrink-0 z-20">
    <div class="flex items-center gap-2">
      <i data-lucide="scan" class="w-5 h-5 text-sky-400"></i>
      <span class="text-xs font-bold tracking-wider uppercase text-zinc-100">Slitscan</span>
      <!-- モード切替タブ -->
      <div class="flex bg-zinc-800 p-0.5 rounded text-[11px] ml-1">
        <button id="mode-live-btn" class="px-2 py-0.5 rounded bg-zinc-700 text-white font-medium">ライブ</button>
        <button id="mode-file-btn" class="px-2 py-0.5 rounded text-zinc-400 hover:text-white">静止画</button>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- 録画ボタン -->
      <button id="record-btn" class="flex items-center gap-1 px-2.5 py-1 rounded bg-zinc-800 border border-zinc-700 text-[11px] text-zinc-200">
        <span id="record-indicator" class="w-2 h-2 rounded-full bg-zinc-500"></span>
        <span id="record-text">録画</span>
      </button>

      <!-- 書き出しボタン -->
      <div class="relative">
        <button id="export-menu-btn" class="flex items-center gap-1 px-2.5 py-1 rounded bg-sky-500 text-zinc-950 font-semibold text-[11px]">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>保存</span>
        </button>
        <div id="export-menu" class="hidden absolute right-0 mt-1 w-28 bg-zinc-800 border border-zinc-700 rounded shadow-2xl z-50 py-1 text-xs">
          <button id="export-png-btn" class="w-full text-left px-3 py-1.5 hover:bg-zinc-700 text-zinc-200">PNG保存</button>
          <button id="export-jpeg-btn" class="w-full text-left px-3 py-1.5 hover:bg-zinc-700 text-zinc-200">JPEG保存</button>
        </div>
      </div>
    </div>
  </header>

  <!-- キャンバス表示エリア（スマホ画面の主役） -->
  <div class="flex-1 relative bg-black flex items-center justify-center overflow-hidden p-1.5">
    <div class="relative w-full h-full flex items-center justify-center checkerboard rounded border border-zinc-800 overflow-hidden">
      <canvas id="slit-canvas" class="max-w-full max-h-full object-contain"></canvas>

      <!-- カメラ未起動時のオーバーレイ警告・開始トリガー -->
      <div id="camera-prompt" class="absolute inset-0 bg-zinc-950/90 flex flex-col items-center justify-center p-4 text-center z-10 space-y-3">
        <div class="w-12 h-12 rounded-full bg-sky-500/10 flex items-center justify-center text-sky-400">
          <i data-lucide="video" class="w-6 h-6"></i>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-zinc-200" id="prompt-title">カメラへの接続が必要です</h2>
          <p class="text-[11px] text-zinc-400 mt-1 max-w-xs" id="prompt-desc">
            下のボタンをタップしてカメラの使用を許可してください。
          </p>
        </div>
        <button id="btn-request-cam" class="px-5 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-zinc-950 text-xs font-semibold flex items-center gap-2 shadow-lg shadow-sky-500/20 active:scale-95 transition">
          <i data-lucide="camera" class="w-4 h-4"></i>
          カメラを起動する
        </button>
        <div id="security-warning" class="hidden text-[10px] text-amber-400 bg-amber-950/40 border border-amber-800/60 p-2 rounded max-w-xs text-left"></div>
      </div>

      <!-- キャンバス情報バッジ -->
      <div class="absolute bottom-2 left-2 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded px-2 py-0.5 text-[10px] font-mono text-zinc-400 pointer-events-none">
        <span id="canvas-dim">1280×720</span> | スライス: <span id="slice-counter">0</span>
      </div>

      <!-- カラー抽出プレビュー浮遊バッジ -->
      <div class="absolute bottom-2 right-2 flex items-center gap-1.5 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded px-2 py-1 pointer-events-none">
        <div id="average-color" class="w-3.5 h-3.5 rounded border border-zinc-700 bg-transparent"></div>
        <span id="hex-label" class="text-[10px] font-mono text-zinc-300">#------</span>
      </div>
    </div>
  </div>

  <!-- 下部操作パネル（スマホで親指操作しやすいコンパクト設計） -->
  <div class="bg-zinc-900 border-t border-zinc-800 p-2.5 flex flex-col gap-2 shrink-0 z-20">
    
    <!-- ライブカメラ用UI -->
    <div id="live-controls" class="space-y-2">
      <!-- プレビュー窓 ＆ スリット位置スライダー -->
      <div class="flex items-center gap-3">
        <div class="relative w-16 h-12 bg-black rounded overflow-hidden border border-zinc-700 shrink-0">
          <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
          <div id="guide-line" class="absolute bg-sky-400 pointer-events-none"></div>
        </div>
        <div class="flex-1 space-y-1">
          <div class="flex justify-between text-[11px] text-zinc-400">
            <span>スリット位置</span>
            <span id="slit-pos-label" class="font-mono text-sky-400">50%</span>
          </div>
          <input type="range" id="slit-pos" min="0" max="100" value="50" class="w-full bg-zinc-800 accent-sky-400">
        </div>
      </div>

      <!-- カメラ選択・切替・パラメーター -->
      <div class="grid grid-cols-12 gap-1.5 items-center">
        <!-- カメラセレクトプルダウン -->
        <select id="camera-select" class="col-span-6 bg-zinc-800 border border-zinc-700 rounded px-2 py-1.5 text-zinc-200 text-[11px] truncate focus:outline-none">
          <option value="">カメラ検出待ち...</option>
        </select>

        <!-- 前後カメラ一発切替 -->
        <button id="switch-cam-btn" class="col-span-2 py-1.5 bg-zinc-800 border border-zinc-700 rounded flex items-center justify-center text-zinc-200 active:bg-zinc-700">
          <i data-lucide="flip-horizontal" class="w-4 h-4"></i>
        </button>

        <!-- 方向切替 -->
        <select id="direction-select" class="col-span-4 bg-zinc-800 border border-zinc-700 rounded px-1.5 py-1.5 text-zinc-200 text-[11px] focus:outline-none">
          <option value="vertical">垂直(横流)</option>
          <option value="horizontal">水平(縦流)</option>
        </select>
      </div>
    </div>

    <!-- 静止画用UI -->
    <div id="file-controls" class="hidden space-y-2">
      <input type="file" id="image-input" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-[11px] file:bg-zinc-800 file:text-zinc-200">
      <div class="flex gap-2">
        <button id="scan-animate-btn" class="flex-1 py-1.5 bg-sky-500 text-zinc-950 font-bold rounded text-xs active:bg-sky-400">端から走査</button>
        <button id="barcode-btn" class="flex-1 py-1.5 bg-zinc-800 border border-zinc-700 text-zinc-200 rounded text-xs active:bg-zinc-700">一括バーコード</button>
      </div>
    </div>

    <!-- 共通アクション（一時停止・クリア・スリット幅） -->
    <div class="flex items-center gap-2 pt-1 border-t border-zinc-800/80">
      <button id="pause-btn" class="flex-1 py-1.5 bg-zinc-800 border border-zinc-700 rounded text-zinc-200 text-xs font-medium flex items-center justify-center gap-1 active:bg-zinc-700">
        <i data-lucide="pause" class="w-3.5 h-3.5"></i>
        <span id="pause-text">一時停止</span>
      </button>

      <button id="clear-btn" class="flex-1 py-1.5 bg-zinc-800 border border-zinc-700 rounded text-zinc-200 text-xs font-medium flex items-center justify-center gap-1 active:bg-red-950/40">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span>クリア</span>
      </button>

      <div class="flex items-center gap-1 px-2 py-1 bg-zinc-800 rounded border border-zinc-700 text-[11px] text-zinc-400">
        <span>幅:</span>
        <select id="slit-width" class="bg-transparent text-sky-400 font-mono text-[11px] focus:outline-none">
          <option value="1">1px</option>
          <option value="2">2px</option>
          <option value="3">3px</option>
          <option value="5">5px</option>
          <option value="10">10px</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      });
    }

    lucide.createIcons();

    // DOM要素
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('slit-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const guideLine = document.getElementById('guide-line');
    const slitPosSlider = document.getElementById('slit-pos');
    const slitPosLabel = document.getElementById('slit-pos-label');
    const slitWidthSelect = document.getElementById('slit-width');
    const directionSelect = document.getElementById('direction-select');
    const cameraSelect = document.getElementById('camera-select');
    const switchCamBtn = document.getElementById('switch-cam-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseText = document.getElementById('pause-text');
    const clearBtn = document.getElementById('clear-btn');
    const sliceCounter = document.getElementById('slice-counter');
    const averageColorBox = document.getElementById('average-color');
    const hexLabel = document.getElementById('hex-label');
    const exportMenuBtn = document.getElementById('export-menu-btn');
    const exportMenu = document.getElementById('export-menu');
    const exportPngBtn = document.getElementById('export-png-btn');
    const exportJpegBtn = document.getElementById('export-jpeg-btn');
    const recordBtn = document.getElementById('record-btn');
    const recordIndicator = document.getElementById('record-indicator');
    const recordText = document.getElementById('record-text');

    const modeLiveBtn = document.getElementById('mode-live-btn');
    const modeFileBtn = document.getElementById('mode-file-btn');
    const liveControls = document.getElementById('live-controls');
    const fileControls = document.getElementById('file-controls');
    const imageInput = document.getElementById('image-input');
    const scanAnimateBtn = document.getElementById('scan-animate-btn');
    const barcodeBtn = document.getElementById('barcode-btn');

    const cameraPrompt = document.getElementById('camera-prompt');
    const btnRequestCam = document.getElementById('btn-request-cam');
    const promptTitle = document.getElementById('prompt-title');
    const promptDesc = document.getElementById('prompt-desc');
    const securityWarning = document.getElementById('security-warning');

    // 内部状態
    let stream = null;
    let isPaused = false;
    let currentMode = 'live';
    let sliceCount = 0;
    let currentDevices = [];
    let currentFacingMode = 'environment';
    let loadedImage = null;
    let animationFrameId = null;

    // 録画用
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // キャンバス初期化（端末解像度に合わせてフィット）
    function initCanvas(w = 1280, h = 720) {
      canvas.width = w;
      canvas.height = h;
      document.getElementById('canvas-dim').textContent = `${w}×${h}`;
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, w, h);
    }
    initCanvas();

    // 環境チェック (HTTPS / localhost)
    function checkEnvironment() {
      const isLocalhost = Boolean(
        window.location.hostname === 'localhost' ||
        window.location.hostname === '[::1]' ||
        window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
      );
      if (!window.isSecureContext && !isLocalhost) {
        securityWarning.classList.remove('hidden');
        securityWarning.innerHTML = `⚠️ <strong>セキュリティ警告:</strong> カメラ機能は <code>https://</code> または <code>localhost</code> でのみ動作します。現在 <code>${window.location.protocol}</code> で開かれているためブラウザによりブロックされています。`;
        return false;
      }
      return true;
    }

    // カメラ列挙
    async function refreshCameraList() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        currentDevices = devices.filter(d => d.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        if (currentDevices.length === 0) {
          const opt = document.createElement('option');
          opt.text = 'カメラが見つかりません';
          opt.value = '';
          cameraSelect.appendChild(opt);
          return;
        }

        currentDevices.forEach((device, index) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          opt.text = device.label || `カメラ ${index + 1} (${device.deviceId ? device.deviceId.slice(0, 4) : 'id'})`;
          cameraSelect.appendChild(opt);
        });

        if (stream) {
          const track = stream.getVideoTracks()[0];
          if (track) {
            const settings = track.getSettings();
            if (settings.deviceId) cameraSelect.value = settings.deviceId;
          }
        }
      } catch (err) {
        console.error('デバイス列挙失敗:', err);
      }
    }

    // カメラ起動
    async function startCamera(deviceId = null) {
      if (!checkEnvironment()) return;

      promptTitle.textContent = 'カメラ起動中...';
      promptDesc.textContent = '端末のカメラを初期化しています。';

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }

      // スマホ向け設定：facingModeを優先、解像度は柔軟に
      const constraints = {
        audio: false,
        video: deviceId 
          ? { deviceId: { exact: deviceId } } 
          : { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        handleStreamSuccess(stream);
      } catch (err) {
        console.warn('高設定起動失敗、デフォルト設定で再試行:', err);
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          handleStreamSuccess(stream);
        } catch (finalErr) {
          console.error('カメラ完全停止:', finalErr);
          promptTitle.textContent = 'カメラへのアクセスができません';
          promptDesc.textContent = `エラー: [${finalErr.name}] ${finalErr.message}。ブラウザのサイト権限でカメラが許可されているか確認してください。`;
          cameraPrompt.classList.remove('hidden');
        }
      }
    }

    function handleStreamSuccess(activeStream) {
      video.srcObject = activeStream;
      video.onloadedmetadata = () => {
        video.play().catch(e => console.log('再生待機:', e));
        cameraPrompt.classList.add('hidden');
        updateGuide();
        refreshCameraList();
      };
    }

    function updateGuide() {
      const pos = slitPosSlider.value;
      slitPosLabel.textContent = `${pos}%`;
      const isVert = directionSelect.value === 'vertical';
      if (isVert) {
        guideLine.style.top = '0';
        guideLine.style.bottom = '0';
        guideLine.style.height = '100%';
        guideLine.style.left = `${pos}%`;
        guideLine.style.width = '2px';
      } else {
        guideLine.style.left = '0';
        guideLine.style.right = '0';
        guideLine.style.width = '100%';
        guideLine.style.top = `${pos}%`;
        guideLine.style.height = '2px';
      }
    }

    // メイン描画ループ
    function renderLoop() {
      if (currentMode === 'live' && !isPaused && video.readyState >= 2) {
        drawSlit(video);
      }
      requestAnimationFrame(renderLoop);
    }

    function drawSlit(source, customPos = null) {
      const isVert = directionSelect.value === 'vertical';
      const width = parseInt(slitWidthSelect.value);
      const posRatio = (customPos !== null ? customPos : parseInt(slitPosSlider.value)) / 100;

      const sw = source.videoWidth || source.width;
      const sh = source.videoHeight || source.height;
      if (!sw || !sh) return;

      if (isVert) {
        const sx = Math.floor((sw - width) * posRatio);
        ctx.drawImage(canvas, width, 0, canvas.width - width, canvas.height, 0, 0, canvas.width - width, canvas.height);
        ctx.drawImage(source, sx, 0, width, sh, canvas.width - width, 0, width, canvas.height);
      } else {
        const sy = Math.floor((sh - width) * posRatio);
        ctx.drawImage(canvas, 0, width, canvas.width, canvas.height - width, 0, 0, canvas.width, canvas.height - width);
        ctx.drawImage(source, 0, sy, sw, width, 0, canvas.height - width, canvas.width, width);
      }

      sliceCount++;
      sliceCounter.textContent = sliceCount;
      inspectColor(source, isVert, posRatio, sw, sh);
    }

    function inspectColor(source, isVert, posRatio, sw, sh) {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = 1;
      tempCanvas.height = 1;

      const sx = isVert ? Math.floor(sw * posRatio) : Math.floor(sw / 2);
      const sy = isVert ? Math.floor(sh / 2) : Math.floor(sh * posRatio);

      tempCtx.drawImage(source, sx, sy, 1, 1, 0, 0, 1, 1);
      const pixel = tempCtx.getImageData(0, 0, 1, 1).data;
      const hex = `#${((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1)}`;

      averageColorBox.style.backgroundColor = hex;
      hexLabel.textContent = hex.toUpperCase();
    }

    // 静止画モード
    function scanStaticImage() {
      if (!loadedImage) return;
      let pos = 0;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);

      function stepScan() {
        if (pos <= 100) {
          drawSlit(loadedImage, pos);
          pos += 0.5;
          animationFrameId = requestAnimationFrame(stepScan);
        }
      }
      stepScan();
    }

    function makeBarcode() {
      if (!loadedImage) return;
      const isVert = directionSelect.value === 'vertical';
      const steps = isVert ? canvas.width : canvas.height;
      const sw = loadedImage.width;
      const sh = loadedImage.height;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < steps; i++) {
        const ratio = i / steps;
        if (isVert) {
          const sx = Math.floor(sw * ratio);
          ctx.drawImage(loadedImage, sx, 0, 1, sh, i, 0, 1, canvas.height);
        } else {
          const sy = Math.floor(sh * ratio);
          ctx.drawImage(loadedImage, 0, sy, sw, 1, 0, i, canvas.width, 1);
        }
      }
    }

    // イベントバインド
    btnRequestCam.addEventListener('click', () => startCamera());

    slitPosSlider.addEventListener('input', updateGuide);
    directionSelect.addEventListener('change', updateGuide);

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseText.textContent = isPaused ? '再開' : '一時停止';
      pauseBtn.classList.toggle('text-sky-400', isPaused);
    });

    clearBtn.addEventListener('click', () => {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      sliceCount = 0;
      sliceCounter.textContent = '0';
    });

    cameraSelect.addEventListener('change', (e) => {
      if (e.target.value) startCamera(e.target.value);
    });

    switchCamBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      startCamera();
    });

    modeLiveBtn.addEventListener('click', () => {
      currentMode = 'live';
      modeLiveBtn.classList.add('bg-zinc-700', 'text-white');
      modeLiveBtn.classList.remove('text-zinc-400');
      modeFileBtn.classList.remove('bg-zinc-700', 'text-white');
      modeFileBtn.classList.add('text-zinc-400');
      liveControls.classList.remove('hidden');
      fileControls.classList.add('hidden');
    });

    modeFileBtn.addEventListener('click', () => {
      currentMode = 'file';
      modeFileBtn.classList.add('bg-zinc-700', 'text-white');
      modeFileBtn.classList.remove('text-zinc-400');
      modeLiveBtn.classList.remove('bg-zinc-700', 'text-white');
      modeLiveBtn.classList.add('text-zinc-400');
      fileControls.classList.remove('hidden');
      liveControls.classList.add('hidden');
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            loadedImage = img;
            initCanvas(img.width, img.height);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    scanAnimateBtn.addEventListener('click', scanStaticImage);
    barcodeBtn.addEventListener('click', makeBarcode);

    // エクスポート
    exportMenuBtn.addEventListener('click', () => {
      exportMenu.classList.toggle('hidden');
    });

    function downloadCanvas(type = 'image/png', ext = 'png') {
      const a = document.createElement('a');
      a.download = `slitscan-${Date.now()}.${ext}`;
      a.href = canvas.toDataURL(type, 0.95);
      a.click();
      exportMenu.classList.add('hidden');
    }
    exportPngBtn.addEventListener('click', () => downloadCanvas('image/png', 'png'));
    exportJpegBtn.addEventListener('click', () => downloadCanvas('image/jpeg', 'jpg'));

    // 録画機能
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        const streamRec = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(streamRec, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.download = `slitscan-${Date.now()}.webm`;
          a.href = url;
          a.click();
          URL.revokeObjectURL(url);
        };
        mediaRecorder.start();
        isRecording = true;
        recordIndicator.classList.replace('bg-zinc-500', 'bg-red-500');
        recordText.textContent = '停止';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordIndicator.classList.replace('bg-red-500', 'bg-zinc-500');
        recordText.textContent = '録画';
      }
    });

    // 初期起動
    checkEnvironment();
    // 最初のタップで自動起動を試みる
    window.addEventListener('touchstart', () => {
      if (!stream) startCamera();
    }, { once: true });

    renderLoop();
  </script>
</body>
</html>
